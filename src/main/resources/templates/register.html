<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注册 - 快餐订制与配送系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f172a, #1e293b); }
        .register-box { width: 380px; background: #fff; border-radius: 16px; padding: 36px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
        .register-box h2 { text-align: center; margin-bottom: 24px; color: #0f172a; }
        .register-box .btn { width: 100%; margin-top: 8px; }
        .msg { text-align: center; font-size: 13px; margin-top: 10px; }
        .msg.error { color: #ef4444; }
    </style>
</head>
<body>
<div class="register-box">
    <h2>注册账号</h2>
    <form th:action="@{/auth/register}" method="post" onsubmit="return checkPwd()">
        <div class="form-group">
            <label>账号</label>
            <label for="account"></label><input class="form-control" type="text" name="account" id="account" required>
        </div>
        <div class="form-group">
            <label>密码</label>
            <label for="password"></label><input class="form-control" type="password" name="password" id="password" required>
        </div>
        <div class="form-group">
            <label>确认密码</label>
            <label for="password2"></label><input class="form-control" type="password" id="password2" required>
        </div>
        <button class="btn btn-primary" type="submit">注册</button>
    </form>
    <p class="msg error" th:if="${error}" th:text="${error}"></p>
    <p style="text-align:center;margin-top:16px;font-size:13px;">
        已有账号？<a th:href="@{/auth/login}" style="color:#0099cc;">去登录</a>
    </p>
</div>
<script>
    function checkPwd() {
        const p1 = document.getElementById('password').value;
        const p2 = document.getElementById('password2').value;
        if (p1 !== p2) {
            alert('两次密码不一致');
            return false;
        }
        return true;
    }
</script>
</body>
</html>

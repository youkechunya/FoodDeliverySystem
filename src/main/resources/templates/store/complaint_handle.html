<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>投诉处理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/store-sidebar :: sidebar('complaint')}"></div>

    <main class="content-area">
        <header class="top-bar">
            <h4>投诉处理</h4>
            <span class="user-info" th:text="${session.loginUser.account}">store</span>
        </header>
        <section class="content-body">
            <div class="card">
                <div class="card-title">投诉列表</div>
                <table>
                    <thead>
                    <tr><th>ID</th><th>用户ID</th><th>内容</th><th>状态</th><th>操作</th></tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
    let storeId = 0;

    // 页面初始化：拿当前商家的店铺 id
    async function initStore() {
        const stores = await request('/api/store/my/stores');
        if (!stores || stores.length === 0) {
            toast('当前账号未绑定任何店铺');
            return false;
        }
        storeId = stores[0].id;
        return true;
    }

    // 每个 load() 开头都先 initStore
    async function load() {
        if (!(await initStore())) return;
        if (!storeId) return;
        const list = await request(`/api/store/complaint/list/${storeId}`);
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';

        if (!list || list.length === 0) {
            tbody.innerHTML = `
            <tr>
                <td colspan="5" style="text-align:center;color:#94a3b8;padding:24px 0;">
                    暂无投诉
                </td>
            </tr>`;
            return;
        }
        list.forEach(c => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${c.id}</td>
                <td>${c.userId}</td>
                <td>${c.content}</td>
                <td>${c.status}</td>
                <td><button class="btn btn-primary btn-sm" onclick="reply(${c.id})">回复</button></td>`;
            tbody.appendChild(tr);
        });
    }

    async function reply(id) {
        const text = prompt('请输入回复内容：');
        if (!text) return;
        const res = await request(`/api/store/complaint/reply/${id}?reply=${encodeURIComponent(text)}`, { method: 'PUT' });
        toast(res.message);
        load();
    }

    load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>投诉处理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="logo">快餐配送</div>
        <nav>
            <a th:href="@{/api/store/info/page}">店铺信息</a>
            <a th:href="@{/api/store/item/page}">商品管理</a>
            <a th:href="@{/api/store/ticket/page}">店铺订单</a>
            <a class="active" th:href="@{/api/store/complaint/page}">投诉处理</a>
        </nav>
        <a class="logout" th:href="@{/auth/logout}">退出登录</a>
    </aside>
    <main class="content-area">
        <header class="top-bar">
            <h4>投诉处理</h4>
            <span class="user-info" th:text="${session.loginUser.account}">store</span>
        </header>
        <section class="content-body">
            <div class="card">
                <div class="card-title">投诉列表</div>
                <table>
                    <thead>
                    <tr><th>ID</th><th>用户ID</th><th>内容</th><th>状态</th><th>操作</th></tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
    const storeId = /*[[${session.loginUser.id}]]*/ 0;

    async function load() {
        const list = await request(`/api/store/complaint/list/${storeId}`);
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';
        list.forEach(c => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${c.id}</td>
                <td>${c.userId}</td>
                <td>${c.content}</td>
                <td>${c.status}</td>
                <td><button class="btn btn-primary btn-sm" onclick="reply(${c.id})">回复</button></td>`;
            tbody.appendChild(tr);
        });
    }

    async function reply(id) {
        const text = prompt('请输入回复内容：');
        if (!text) return;
        const res = await request(`/api/store/complaint/reply/${id}?reply=${encodeURIComponent(text)}`, { method: 'PUT' });
        toast(res.message);
        load();
    }

    load();
</script>
</body>
</html>

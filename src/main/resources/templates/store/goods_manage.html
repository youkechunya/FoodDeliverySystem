<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="logo">快餐配送</div>
        <nav>
            <a th:href="@{/api/store/info/page}">店铺信息</a>
            <a class="active" th:href="@{/api/store/item/page}">商品管理</a>
            <a th:href="@{/api/store/ticket/page}">店铺订单</a>
            <a th:href="@{/api/store/complaint/page}">投诉处理</a>
        </nav>
        <a class="logout" th:href="@{/auth/logout}">退出登录</a>
    </aside>
    <main class="content-area">
        <header class="top-bar">
            <h4>商品管理</h4>
            <span class="user-info" th:text="${session.loginUser.account}">store</span>
        </header>
        <section class="content-body">
            <div class="card">
                <div class="card-title">
                    <span>商品列表</span>
                    <button class="btn btn-primary btn-sm" onclick="openAdd()">新增商品</button>
                </div>
                <table>
                    <thead>
                    <tr><th>ID</th><th>名称</th><th>价格</th><th>库存</th><th>操作</th></tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
                <div class="pagination" id="pagination"></div>
            </div>
        </section>
    </main>
</div>

<div class="modal-mask" id="modal">
    <div class="modal">
        <h5 id="modalTitle">新增商品</h5>
        <input type="hidden" id="f_id">
        <div class="form-group"><label>名称</label><input class="form-control" id="f_name"></div>
        <div class="form-group"><label>类型ID</label><input class="form-control" id="f_typeId" type="number"></div>
        <div class="form-group"><label>价格</label><input class="form-control" id="f_price" type="number" step="0.01"></div>
        <div class="form-group"><label>库存</label><input class="form-control" id="f_remain" type="number"></div>
        <div class="form-group"><label>备注</label><input class="form-control" id="f_note"></div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModal('modal')">取消</button>
            <button class="btn btn-primary" onclick="save()">保存</button>
        </div>
    </div>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
    let pageNum = 1;
    const pageSize = 5;

    async function load() {
        const data = await request(`/api/store/item/list?pageNum=${pageNum}&pageSize=${pageSize}`);
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';
        data.list.forEach(i => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${i.id}</td>
                <td>${i.name}</td>
                <td>${i.price}</td>
                <td>${i.remain}</td>
                <td>
                    <button class="btn btn-outline btn-sm" onclick="openEdit(${i.id})">编辑</button>
                    <button class="btn btn-danger btn-sm" onclick="del(${i.id})">删除</button>
                </td>`;
            tbody.appendChild(tr);
        });
        renderPagination(document.getElementById('pagination'), data.pageNum, data.pages, p => {
            pageNum = p;
            load();
        });
    }

    function openAdd() {
        document.getElementById('modalTitle').textContent = '新增商品';
        ['f_id','f_name','f_typeId','f_price','f_remain','f_note'].forEach(id => document.getElementById(id).value = '');
        openModal('modal');
    }

    async function openEdit(id) {
        const i = await request(`/api/store/item/${id}`);
        document.getElementById('modalTitle').textContent = '编辑商品';
        document.getElementById('f_id').value = i.id;
        document.getElementById('f_name').value = i.name;
        document.getElementById('f_typeId').value = i.typeId;
        document.getElementById('f_price').value = i.price;
        document.getElementById('f_remain').value = i.remain;
        document.getElementById('f_note').value = i.note;
        openModal('modal');
    }

    async function save() {
        const id = document.getElementById('f_id').value;
        const body = {
            id: id ? parseInt(id) : 0,
            name: document.getElementById('f_name').value,
            typeId: parseInt(document.getElementById('f_typeId').value) || null,
            price: parseFloat(document.getElementById('f_price').value) || 0,
            remain: parseInt(document.getElementById('f_remain').value) || 0,
            note: document.getElementById('f_note').value,
            sales: 0
        };
        const url = id ? '/api/store/item/update' : '/api/store/item/add';
        const method = id ? 'PUT' : 'POST';
        const res = await request(url, { method, body: JSON.stringify(body) });
        toast(res.message);
        if (res.success) {
            closeModal('modal');
            load();
        }
    }

    async function del(id) {
        if (!confirm('确定删除？')) return;
        const res = await request(`/api/store/item/delete/${id}`, { method: 'DELETE' });
        toast(res.message);
        load();
    }

    load();
</script>
</body>
</html>

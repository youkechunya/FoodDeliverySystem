<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>店铺订单</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/store-sidebar :: sidebar('ticket')}"></div>

    <main class="content-area">
        <header class="top-bar">
            <h4>店铺订单</h4>
            <span class="user-info" th:text="${session.loginUser.account}">store</span>
        </header>
        <section class="content-body">
            <div class="card">
                <div class="card-title">订单列表</div>
                <table>
                    <thead>
                    <tr><th>ID</th><th>地址</th><th>状态</th><th>操作</th></tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<div class="modal-mask" id="itemModal">
    <div class="modal" style="width: 520px;">
        <h5>订单明细</h5>
        <table>
            <thead>
            <tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th></tr>
            </thead>
            <tbody id="itemBody"></tbody>
            <tfoot>
            <tr><th colspan="3" style="text-align:right;">合计</th><th id="itemTotal"></th></tr>
            </tfoot>
        </table>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModal('itemModal')">关闭</button>
        </div>
    </div>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
    let storeId = 0;

    async function initStore() {
        const stores = await request('/api/store/my/stores');
        if (!stores || stores.length === 0) {
            toast('当前账号未绑定任何店铺');
            return false;
        }
        storeId = stores[0].id;
        return true;
    }

    async function load() {
        if (!(await initStore())) return;

        const list = await request(`/api/store/ticket/list/${storeId}`);
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';

        if (!list || list.length === 0) {
            tbody.innerHTML = `
            <tr>
                <td colspan="4" style="text-align:center;color:#94a3b8;padding:24px 0;">
                    暂无订单
                </td>
            </tr>`;
            return;
        }

        list.forEach(t => {
            let buttons = '';
            if (t.status === '待接单') {
                buttons = `<button class="btn btn-primary btn-sm" onclick="updateStatus(${t.id}, '已接单')">接单</button>`;
            } else {
                buttons = `<span class="muted">—</span>`;
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${t.id}</td>
                <td>${t.address}</td>
                <td>${t.status}</td>
                <td>
                    <button class="btn btn-outline btn-sm" onclick="viewItems(${t.id})">明细</button>
                    ${buttons}
                </td>`;
            tbody.appendChild(tr);
        });
    }

    async function viewItems(ticketId) {
        const items = await request(`/api/store/ticket/items/${ticketId}`);
        const tbody = document.getElementById('itemBody');
        tbody.innerHTML = '';

        if (!items || items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">无明细</td></tr>';
            document.getElementById('itemTotal').textContent = '';
        } else {
            let total = 0;
            items.forEach(i => {
                const name = i.itemName || ('商品#' + i.itemId);
                const subtotal = (parseFloat(i.price) * i.quantity).toFixed(2);
                total += parseFloat(subtotal);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${name}</td>
                    <td>${i.price}</td>
                    <td>${i.quantity}</td>
                    <td>${subtotal}</td>`;
                tbody.appendChild(tr);
            });
            document.getElementById('itemTotal').textContent = '￥' + total.toFixed(2);
        }
        openModal('itemModal');
    }

    async function updateStatus(id, status) {
        let url = `/api/store/ticket/status/${id}?status=${encodeURIComponent(status)}`;

        if (status === '已接单') {
            const rateStr = prompt('请输入配送倍率（0~1，默认 0.4）：', '0.4');
            if (rateStr === null) return;
            const rate = parseFloat(rateStr);
            if (isNaN(rate) || rate < 0 || rate > 1) {
                toast('倍率必须在 0 ~ 1 之间');
                return;
            }
            url += `&rate=${rate}`;
        }

        const res = await request(url, { method: 'PUT' });
        toast(res.message);
        if (res.success) {
            await load();
        }
    }

    load();
</script>
</body>
</html>

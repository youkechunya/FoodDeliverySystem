<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>店铺信息</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/store-sidebar :: sidebar('info')}"></div>

    <main class="content-area">
        <header class="top-bar">
            <h4>店铺信息</h4>
            <span class="user-info" th:text="${session.loginUser.account} + ' · ' + ${session.loginRole.roleName}">store</span>
        </header>
        <section class="content-body">
            <div class="card">
                <div class="card-title">基本信息</div>
                <div class="form-group"><label>店铺名</label><input class="form-control" id="name"></div>
                <div class="form-group"><label>地址</label><input class="form-control" id="address"></div>
                <div class="form-group"><label>评分</label><input class="form-control" id="score" type="number" step="0.1"></div>
                <button class="btn btn-primary" onclick="save()">保存修改</button>
            </div>
        </section>
    </main>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
    let storeId = 0;

    async function initStore() {
        const stores = await request('/api/store/my/stores');
        if (!stores || stores.length === 0) {
            toast('当前账号未绑定任何店铺');
            return false;
        }
        storeId = stores[0].id;
        return true;
    }

    async function load() {
        if (!(await initStore())) return;
        const s = await request(`/api/store/info/${storeId}`);
        document.getElementById('name').value = s.name;
        document.getElementById('address').value = s.address;
        document.getElementById('score').value = s.score;
    }

    async function save() {
        if (!storeId) {
            toast('未找到所属店铺');
            return;
        }
        const body = {
            id: storeId,
            name: document.getElementById('name').value,
            address: document.getElementById('address').value,
            score: parseFloat(document.getElementById('score').value),
            status: '通过'
        };
        const res = await request('/api/store/info/update', {
            method: 'PUT',
            body: JSON.stringify(body)
        });
        toast(res.message);
    }

    load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>店铺信息</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="logo">快餐配送</div>
        <nav>
            <a class="active" th:href="@{/api/store/info/page}">店铺信息</a>
            <a th:href="@{/api/store/item/page}">商品管理</a>
            <a th:href="@{/api/store/ticket/page}">店铺订单</a>
            <a th:href="@{/api/store/complaint/page}">投诉处理</a>
        </nav>
        <a class="logout" th:href="@{/auth/logout}">退出登录</a>
    </aside>
    <main class="content-area">
        <header class="top-bar">
            <h4>店铺信息</h4>
            <span class="user-info" th:text="${session.loginUser.account}">store</span>
        </header>
        <section class="content-body">
            <div class="card">
                <div class="card-title">基本信息</div>
                <div class="form-group"><label>店铺名</label><input class="form-control" id="name"></div>
                <div class="form-group"><label>地址</label><input class="form-control" id="address"></div>
                <div class="form-group"><label>评分</label><input class="form-control" id="score" type="number" step="0.1"></div>
                <button class="btn btn-primary" onclick="save()">保存修改</button>
            </div>
        </section>
    </main>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
    const storeId = /*[[${session.loginUser.id}]]*/ 0;

    async function load() {
        const s = await request(`/api/store/info/${storeId}`);
        document.getElementById('name').value = s.name;
        document.getElementById('address').value = s.address;
        document.getElementById('score').value = s.score;
    }

    async function save() {
        const body = {
            id: storeId,
            name: document.getElementById('name').value,
            address: document.getElementById('address').value,
            score: parseFloat(document.getElementById('score').value),
            status: '通过'
        };
        const res = await request('/api/store/info/update', {
            method: 'PUT',
            body: JSON.stringify(body)
        });
        toast(res.message);
    }

    load();
</script>
</body>
</html>

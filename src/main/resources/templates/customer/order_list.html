<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的订单</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="logo">快餐配送</div>
        <nav>
            <a th:href="@{/api/customer/store/page}">店铺</a>
            <a th:href="@{/api/customer/cart/page}">购物车</a>
            <a class="active" th:href="@{/api/customer/ticket/page}">我的订单</a>
        </nav>
        <a class="logout" th:href="@{/auth/logout}">退出登录</a>
    </aside>
    <main class="content-area">
        <header class="top-bar">
            <h4>我的订单</h4>
            <span class="user-info" th:text="${session.loginUser.account}">customer</span>
        </header>
        <section class="content-body">
            <div class="card">
                <div class="card-title">订单列表</div>
                <table>
                    <thead>
                    <tr><th>ID</th><th>地址</th><th>店铺ID</th><th>状态</th><th>操作</th></tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
    const userId = /*[[${session.loginUser.id}]]*/ 0;

    async function load() {
        const list = await request(`/api/customer/ticket/list/${userId}`);
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';
        list.forEach(t => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${t.id}</td>
                <td>${t.address}</td>
                <td>${t.storeId}</td>
                <td>${t.status}</td>
                <td>
                    <button class="btn btn-outline btn-sm" onclick="review(${t.storeId})">评价</button>
                    <button class="btn btn-danger btn-sm" onclick="complaint(${t.storeId}, ${t.id})">投诉</button>
                </td>`;
            tbody.appendChild(tr);
        });
    }

    function review(storeId) {
        location.href = `/api/customer/review/page?storeId=${storeId}`;
    }

    async function complaint(storeId, ticketId) {
        const content = prompt('请输入投诉内容：');
        if (!content) return;
        const body = { userId, storeId, ticketId, content };
        const res = await request('/api/customer/complaint/add', {
            method: 'POST',
            body: JSON.stringify(body)
        });
        toast(res.message);
    }

    load();
</script>
</body>
</html>

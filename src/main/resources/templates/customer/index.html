<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>店铺首页</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="logo">快餐配送</div>
        <nav>
            <a class="active" th:href="@{/api/customer/store/page}">店铺</a>
            <a th:href="@{/api/customer/cart/page}">购物车</a>
            <a th:href="@{/api/customer/ticket/page}">我的订单</a>
            <a th:href="@{/api/customer/review/page}">评价</a>
        </nav>
        <a class="logout" th:href="@{/auth/logout}">退出登录</a>
    </aside>
    <main class="content-area">
        <header class="top-bar">
            <h4>店铺列表</h4>
            <span class="user-info" th:text="${session.loginUser.account}">customer</span>
        </header>
        <section class="content-body">
            <div class="card">
                <div class="card-title">店铺</div>
                <table>
                    <thead>
                    <tr><th>ID</th><th>店铺名</th><th>地址</th><th>评分</th><th>操作</th></tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
                <div class="pagination" id="pagination"></div>
            </div>
        </section>
    </main>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
    let pageNum = 1;
    const pageSize = 5;

    async function load() {
        const data = await request(`/api/customer/store/list?pageNum=${pageNum}&pageSize=${pageSize}`);
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';
        data.list.forEach(s => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${s.id}</td>
                <td>${s.name}</td>
                <td>${s.address}</td>
                <td>${s.score ?? '-'}</td>
                <td>
                    <button class="btn btn-primary btn-sm" onclick="toOrder(${s.id})">去下单</button>
                    <button class="btn btn-outline btn-sm" onclick="toReview(${s.id})">看评价</button>
                </td>`;
            tbody.appendChild(tr);
        });
        renderPagination(document.getElementById('pagination'), data.pageNum, data.pages, p => {
            pageNum = p;
            load();
        });
    }

    function toOrder(storeId) {
        location.href = `/api/customer/item/page?storeId=${storeId}`;
    }

    function toReview(storeId) {
        location.href = `/api/customer/review/store/${storeId}`;
    }

    load();
</script>
</body>
</html>

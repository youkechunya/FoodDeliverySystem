<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>评价</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="logo">快餐配送</div>
        <nav>
            <a th:href="@{/api/customer/store/page}">店铺</a>
            <a th:href="@{/api/customer/ticket/page}">我的订单</a>
            <a class="active" th:href="@{/api/customer/review/page}">评价</a>
        </nav>
        <a class="logout" th:href="@{/auth/logout}">退出登录</a>
    </aside>
    <main class="content-area">
        <header class="top-bar">
            <h4>发表评价</h4>
            <span class="user-info" th:text="${session.loginUser.account}">customer</span>
        </header>
        <section class="content-body">
            <div class="card">
                <div class="card-title">评价内容</div>
                <div class="form-group">
                    <label>店铺ID</label>
                    <input class="form-control" id="storeId" readonly>
                </div>
                <div class="form-group">
                    <label>评价内容</label>
                    <textarea class="form-control" id="content" rows="4"></textarea>
                </div>
                <button class="btn btn-primary" onclick="submitReview()">提交评价</button>
            </div>
        </section>
    </main>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
    const params = new URLSearchParams(location.search);
    const storeId = params.get('storeId') || '';
    document.getElementById('storeId').value = storeId;
    const userId = /*[[${session.loginUser.id}]]*/ 0;

    async function submitReview() {
        const body = {
            userId: userId,
            storeId: parseInt(storeId),
            content: document.getElementById('content').value
        };
        const res = await request('/api/customer/review/add', {
            method: 'POST',
            body: JSON.stringify(body)
        });
        toast(res.message);
        if (res.success) {
            location.href = '/api/customer/ticket/page';
        }
    }
</script>
</body>
</html>

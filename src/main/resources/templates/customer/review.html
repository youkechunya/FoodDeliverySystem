<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>评价</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/customer-sidebar :: sidebar('ticket')}"></div>

    <main class="content-area">
        <header class="top-bar">
            <h4>发表评价</h4>
            <span class="user-info" th:text="${session.loginUser.account} + ' · ' + ${session.loginRole.roleName}">customer</span>
        </header>
        <section class="content-body">
            <div class="card">
                <div class="card-title">评价内容</div>
                <div class="form-group">
                    <label>店铺ID</label>
                    <input class="form-control" id="storeId" readonly>
                </div>
                <div class="form-group">
                    <label>评价内容</label>
                    <textarea class="form-control" id="content" rows="4"></textarea>
                </div>
                <button class="btn btn-primary" onclick="submitReview()">提交评价</button>
            </div>
        </section>
    </main>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
    const params = new URLSearchParams(location.search);
    const storeId = params.get('storeId') || '';
    document.getElementById('storeId').value = storeId;

    async function submitReview() {
        const body = {
            storeId: parseInt(storeId),
            content: document.getElementById('content').value
        };
        const res = await request('/api/customer/review/add', {
            method: 'POST',
            body: JSON.stringify(body)
        });
        toast(res.message);
        if (res.success) {
            location.href = '/api/customer/ticket/page';
        }
    }
</script>
</body>
</html>

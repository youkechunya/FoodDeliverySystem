<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>店铺管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/admin-sidebar :: sidebar('store')}"></div>

    <main class="content-area">
        <header class="top-bar">
            <h4>店铺管理</h4>
            <span class="user-info" th:text="${session.loginUser.account}">admin</span>
        </header>
        <section class="content-body">
            <div class="card">
                <div class="card-title">
                    <span>店铺列表</span>
                    <button class="btn btn-primary btn-sm" onclick="openAdd()">新增店铺</button>
                </div>
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>店铺名</th>
                        <th>地址</th>
                        <th>评分</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
                <div class="pagination" id="pagination"></div>
            </div>
        </section>
    </main>
</div>

<div class="modal-mask" id="modal">
    <div class="modal">
        <h5 id="modalTitle">新增店铺</h5>
        <input type="hidden" id="f_id">
        <div class="form-group"><label>店铺名</label><label for="f_name"></label><input class="form-control" id="f_name"></div>
        <div class="form-group"><label>地址</label><label for="f_address"></label><input class="form-control" id="f_address"></div>
        <div class="form-group">
            <label>评分</label>
            <label for="f_score"></label><input class="form-control" id="f_score"
                                                type="number" step="0.1" min="0" max="10">
        </div>
        <div class="form-group">
            <label>状态</label>
            <label for="f_status"></label><select class="form-control" id="f_status">
                <option value="待审核">待审核</option>
                <option value="通过">通过</option>
                <option value="驳回">驳回</option>
            </select>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModal('modal')">取消</button>
            <button class="btn btn-primary" onclick="save()">保存</button>
        </div>
    </div>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
    let pageNum = 1;
    const pageSize = 5;

    async function load() {
        const data = await request(`/api/admin/store/list?pageNum=${pageNum}&pageSize=${pageSize}`);
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';
        if (!data.list || data.list.length === 0) {
            tbody.innerHTML = `
        <tr>
            <td colspan="6" style="text-align:center;color:#94a3b8;padding:24px 0;">
                暂无店铺
            </td>
        </tr>`;
            document.getElementById('pagination').innerHTML = '';
            return;
        }
        data.list.forEach(s => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${s.id}</td>
                <td>${s.name}</td>
                <td>${s.address}</td>
                <td>${s.score ?? '-'}</td>
                <td>${s.status ?? '-'}</td>
                <td>
                    <button class="btn btn-outline btn-sm" onclick="openEdit(${s.id})">编辑</button>
                    <button class="btn btn-danger btn-sm" onclick="del(${s.id})">删除</button>
                </td>`;
            tbody.appendChild(tr);
        });
        renderPagination(document.getElementById('pagination'), data.pageNum, data.pages, p => {
            pageNum = p;
            load();
        });
    }

    function openAdd() {
        document.getElementById('modalTitle').textContent = '新增店铺';
        document.getElementById('f_id').value = '';
        document.getElementById('f_name').value = '';
        document.getElementById('f_address').value = '';
        document.getElementById('f_score').value = '';
        document.getElementById('f_status').value = '待审核';
        openModal('modal');
    }

    async function openEdit(id) {
        const s = await request(`/api/admin/store/${id}`);
        document.getElementById('modalTitle').textContent = '编辑店铺';
        document.getElementById('f_id').value = s.id;
        document.getElementById('f_name').value = s.name;
        document.getElementById('f_address').value = s.address;
        document.getElementById('f_score').value = s.score;
        document.getElementById('f_status').value = s.status || '待审核';
        openModal('modal');
    }

    async function save() {
        const id = document.getElementById('f_id').value;
        const scoreStr = document.getElementById('f_score').value.trim();
        const score = scoreStr === '' ? 0 : parseFloat(scoreStr);

        if (isNaN(score) || score < 0 || score > 10) {
            toast('评分必须在 0 ~ 10 之间');
            return;
        }

        const body = {
            id: id ? parseInt(id) : 0,
            name: document.getElementById('f_name').value,
            address: document.getElementById('f_address').value,
            score: score,
            status: document.getElementById('f_status').value
        };
        const url = id ? '/api/admin/store/update' : '/api/admin/store/add';
        const method = id ? 'PUT' : 'POST';
        const res = await request(url, { method, body: JSON.stringify(body) });
        toast(res.message);
        if (res.success) {
            closeModal('modal');
            load();
        }
    }

    async function del(id) {
        if (!confirm('确定删除？')) return;
        const res = await request(`/api/admin/store/delete/${id}`, { method: 'DELETE' });
        toast(res.message);
        load();
    }

    load();
</script>
</body>
</html>

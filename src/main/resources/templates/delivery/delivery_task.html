<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配送任务 - 外卖配送系统</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="logo">外卖配送</div>
        <nav id="sideNav">
            <a href="/api/delivery/ticket/page" class="active">配送任务</a>
            <a href="/api/delivery/ticket/mine/page">我的配送</a>
        </nav>
        <a href="javascript:void(0)" class="logout" onclick="doLogout()">退出登录</a>
    </aside>

    <div class="content-area">
        <div class="top-bar">
            <h4>可接配送任务</h4>
            <span class="user-info" id="userInfo">配送员</span>
        </div>

        <div class="content-body">
            <div class="card">
                <div class="card-title">
                    <span>待接单列表</span>
                    <button class="btn btn-outline btn-sm" onclick="loadAvailable(1)">刷新</button>
                </div>
                <table>
                    <thead>
                    <tr>
                        <th>订单号</th>
                        <th>店铺</th>
                        <th>配送地址</th>
                        <th>订单金额</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="taskBody">
                    <tr><td colspan="5" style="text-align:center;color:#94a3b8;">加载中...</td></tr>
                    </tbody>
                </table>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>
</div>

<script src="/js/common.js"></script>
<script>
    function renderTable(list) {
        const tbody = document.getElementById('taskBody');
        if (!list || list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#94a3b8;">暂无可接订单</td></tr>';
            return;
        }
        tbody.innerHTML = list.map(t => `
        <tr>
            <td>#${t.id}</td>
            <td>${t.storeName || '-'}</td>
            <td>${t.address || '-'}</td>
            <td>￥${Number(t.totalAmount || 0).toFixed(2)}</td>
            <td><button class="btn btn-primary btn-sm" onclick="accept(${t.id})">接单</button></td>
        </tr>
    `).join('');
    }

    async function loadAvailable(page) {
        try {
            const data = await request('/api/delivery/ticket/available?pageNum=' + page + '&pageSize=5');
            renderTable(data.list);
            renderPagination(document.getElementById('pagination'), data.pageNum, data.pages, loadAvailable);
        } catch (e) {
            toast('加载失败：' + e.message);
        }
    }

    async function accept(id) {
        try {
            const data = await request('/api/delivery/ticket/accept/' + id, { method: 'PUT' });
            toast(data.message);
            if (data.success) loadAvailable(1);
        } catch (e) {
            toast('接单失败：' + e.message);
        }
    }

    initUserInfo();
    loadAvailable(1);
</script>
</body>
</html>

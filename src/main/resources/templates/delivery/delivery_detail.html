<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的配送</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/delivery-sidebar :: sidebar('mine')}"></div>

    <main class="content-area">
        <header class="top-bar">
            <h4>我的配送</h4>
            <span class="user-info" th:text="${session.loginUser.account}">delivery</span>
        </header>
        <section class="content-body">
            <div class="card">
                <div class="card-title">配送中</div>
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>店铺</th>
                        <th>地址</th>
                        <th>状态</th>
                        <th>订单金额</th>
                        <th>配送金额</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
    async function load() {
        const list = await request('/api/delivery/ticket/mine/detail');
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';

        if (!list || list.length === 0) {
            tbody.innerHTML = `
            <tr>
                <td colspan="7" style="text-align:center;color:#94a3b8;padding:24px 0;">
                    你还没有接任何订单
                </td>
            </tr>`;
            return;
        }

        list.forEach(t => {
            let buttons = '';
            if (t.status === '已接单') {
                buttons = `
                    <button class="btn btn-primary btn-sm" onclick="updateStatus(${t.id}, '配送中')">配送中</button>
                    <button class="btn btn-outline btn-sm" onclick="updateStatus(${t.id}, '已完成')">已完成</button>`;
            } else if (t.status === '配送中') {
                buttons = `
                    <button class="btn btn-outline btn-sm" onclick="updateStatus(${t.id}, '已完成')">已完成</button>`;
            } else {
                buttons = `<span class="muted">—</span>`;
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${t.id}</td>
                <td>${t.storeName}</td>
                <td>${t.address}</td>
                <td>${t.status}</td>
                <td>￥${Number(t.totalAmount).toFixed(2)}</td>
                <td>￥${Number(t.deliveryAmount).toFixed(2)}</td>
                <td>${buttons}</td>`;
            tbody.appendChild(tr);
        });
    }

    async function updateStatus(id, status) {
        const res = await request(`/api/delivery/ticket/status/${id}?status=${encodeURIComponent(status)}`, { method: 'PUT' });
        toast(res.message);
        if (res.success) {
            await load();
        }
    }

    load();
</script>
</body>
</html>

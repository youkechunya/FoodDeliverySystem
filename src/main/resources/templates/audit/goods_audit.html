<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>店铺审核</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/audit-sidebar :: sidebar('store')}"></div>

    <main class="content-area">
        <header class="top-bar">
            <h4>店铺审核</h4>
            <span class="user-info" th:text="${session.loginUser.account}">audit</span>
        </header>
        <section class="content-body">
            <div class="card">
                <div class="card-title">待审核店铺</div>
                <table>
                    <thead>
                    <tr><th>ID</th><th>店铺名</th><th>地址</th><th>评分</th><th>状态</th><th>操作</th></tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
                <div class="pagination" id="pagination"></div>
            </div>
        </section>
    </main>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
    let pageNum = 1;
    const pageSize = 5;

    async function load() {
        const data = await request(`/api/audit/store/list?pageNum=${pageNum}&pageSize=${pageSize}`);
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';

        if (!data.list || data.list.length === 0) {
            tbody.innerHTML = `
            <tr>
                <td colspan="6" style="text-align:center;color:#94a3b8;padding:24px 0;">
                    暂无待审核店铺
                </td>
            </tr>`;
            document.getElementById('pagination').innerHTML = '';
            return;
        }
        data.list.forEach(s => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${s.id}</td>
                <td>${s.name}</td>
                <td>${s.address}</td>
                <td>${s.score ?? '-'}</td>
                <td>${s.status ?? '-'}</td>
                <td>
                    <button class="btn btn-primary btn-sm" onclick="approve(${s.id})">通过</button>
                    <button class="btn btn-danger btn-sm" onclick="reject(${s.id})">驳回</button>
                </td>`;
            tbody.appendChild(tr);
        });
        renderPagination(document.getElementById('pagination'), data.pageNum, data.pages, p => {
            pageNum = p;
            load();
        });
    }

    async function approve(id) {
        const res = await request(`/api/audit/store/approve/${id}`, { method: 'PUT' });
        toast(res.message);
        load();
    }

    async function reject(id) {
        const res = await request(`/api/audit/store/reject/${id}`, { method: 'PUT' });
        toast(res.message);
        load();
    }

    load();
</script>
</body>
</html>

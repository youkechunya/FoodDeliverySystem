<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>评价仲裁</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/audit-sidebar :: sidebar('review')}"></div>

    <main class="content-area">
        <header class="top-bar">
            <h4>评价仲裁</h4>
            <span class="user-info" th:text="${session.loginUser.account}">audit</span>
        </header>
        <section class="content-body">

            <div class="card">
                <div class="card-title">被举报评论</div>
                <table>
                    <thead>
                    <tr>
                        <th>举报ID</th>
                        <th>店铺</th>
                        <th>评论内容</th>
                        <th>举报理由</th>
                        <th>举报时间</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="reportTbody"></tbody>
                </table>
            </div>

            <div class="card">
                <div class="card-title">投诉仲裁</div>
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>用户ID</th>
                        <th>店铺ID</th>
                        <th>内容</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="complaintTbody"></tbody>
                </table>
                <div class="pagination" id="complaintPagination"></div>
            </div>

        </section>
    </main>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
    let cPageNum = 1;
    const pageSize = 5;

    async function loadReports() {
        const list = await request('/api/audit/review/list');
        const tbody = document.getElementById('reportTbody');
        tbody.innerHTML = '';

        if (!list || list.length === 0) {
            tbody.innerHTML = `
            <tr>
                <td colspan="6" style="text-align:center;color:#94a3b8;padding:24px 0;">
                    暂无待处理举报
                </td>
            </tr>`;
            return;
        }

        list.forEach(r => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${r.id}</td>
                <td>${r.storeName ?? '-'}</td>
                <td>${r.reviewContent ?? '-'}</td>
                <td>${r.reason ?? '-'}</td>
                <td>${r.createTime ?? '-'}</td>
                <td>
                    <button class="btn btn-danger btn-sm" onclick="deleteReview(${r.id})">删除评论</button>
                    <button class="btn btn-outline btn-sm" onclick="keepReview(${r.id})">保留评论</button>
                </td>`;
            tbody.appendChild(tr);
        });
    }

    async function deleteReview(reportId) {
        if (!confirm('确定删除该评论？')) return;
        const res = await request(`/api/audit/review/delete/${reportId}`, { method: 'DELETE' });
        toast(res.message);
        if (res.success) loadReports();
    }

    async function keepReview(reportId) {
        const res = await request(`/api/audit/review/keep/${reportId}`, { method: 'PUT' });
        toast(res.message);
        if (res.success) loadReports();
    }

    async function loadComplaints() {
        const data = await request(`/api/audit/complaint/list?pageNum=${cPageNum}&pageSize=${pageSize}`);
        const tbody = document.getElementById('complaintTbody');
        tbody.innerHTML = '';

        if (!data.list || data.list.length === 0) {
            tbody.innerHTML = `
            <tr>
                <td colspan="6" style="text-align:center;color:#94a3b8;padding:24px 0;">
                    暂无投诉
                </td>
            </tr>`;
            document.getElementById('complaintPagination').innerHTML = '';
            return;
        }

        data.list.forEach(c => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${c.id}</td>
                <td>${c.userId}</td>
                <td>${c.storeId}</td>
                <td>${c.content}</td>
                <td>${c.status}</td>
                <td><button class="btn btn-primary btn-sm" onclick="arbitrate(${c.id})">仲裁</button></td>`;
            tbody.appendChild(tr);
        });

        renderPagination(document.getElementById('complaintPagination'), data.pageNum, data.pages, p => {
            cPageNum = p;
            loadComplaints();
        });
    }

    async function arbitrate(id) {
        const text = prompt('请输入仲裁结果：');
        if (!text) return;
        const res = await request(`/api/audit/complaint/arbitrate/${id}?resultText=${encodeURIComponent(text)}`, { method: 'PUT' });
        toast(res.message);
        if (res.success) loadComplaints();
    }

    loadReports();
    loadComplaints();
</script>
</body>
</html>
